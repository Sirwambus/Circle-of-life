<style>
  /* Layout: eine schmale Spalte – Kopf, Bühne (runder Kreis der Spiele oder Spiel-Canvas 16:10), Info-Leiste, Touch-Steuerung. Bewusst nur dunkel. */
  :root {
    --bg: #111217;
    --panel: #1a1c23;
    --line: #2b2e39;
    --fg: #ebe7de;
    --muted: #9b9caa;
    --accent: #f2b84b;
    --display: "Bungee", "Arial Black", Impact, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--fg); }
  [hidden] { display: none !important; }
  body { font-family: var(--mono); }
  .wrap {
    max-width: 980px; margin: 0 auto;
    padding-block: 20px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 16px;
  }
  .top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 5vw, 40px); margin: 0; letter-spacing: 0.02em; }
  h1 span { color: var(--accent); }
  .tag { margin: 0; color: var(--muted); font-size: 13px; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .tools button {
    font: 600 12px var(--mono); padding: 8px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  }
  .tools button b { font-weight: 600; }
  .tools button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 18px rgba(242,184,75,0.25); }
  .tools button:focus-visible, .ctl button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lv { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .lv span { font: 600 11px var(--mono); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .lv span.done { color: #0d0a14; background: var(--cat, var(--accent)); border-color: transparent; }
  .lv span.open { color: var(--cat, var(--accent)); border-color: var(--cat, var(--accent)); }
  .side { display: grid; gap: 14px; align-content: start; min-width: 0; }
  .skills { display: grid; grid-template-columns: auto minmax(80px, 160px) auto; gap: 5px 10px; align-items: center; font-size: 11px; color: var(--muted); }
  .skills b { font-weight: 600; color: var(--c); white-space: nowrap; }
  .skills i { display: block; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .skills i::after { content: ""; display: block; height: 100%; width: var(--w); background: var(--c); box-shadow: 0 0 8px var(--c); }
  .skills em { font-style: normal; font-variant-numeric: tabular-nums; }
  .stage { position: relative; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: #000; }
  canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 10; touch-action: none; }
  #map { aspect-ratio: 1 / 1; touch-action: manipulation; }
  .stage.kreis { width: 100%; max-width: 720px; justify-self: center; border-radius: 50%; border-color: transparent; background: transparent; box-shadow: 0 0 60px rgba(150,90,255,0.18); }
  .info { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 32px; }
  .info > div { min-width: 0; }
  .eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
  h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 4px 0 6px; text-wrap: balance; }
  #wrule { margin: 0; color: var(--muted); max-width: 60ch; line-height: 1.5; font-size: 13px; }
  .keys { display: grid; grid-template-columns: auto auto; gap: 6px 12px; align-content: start; font-size: 12px; color: var(--muted); }
  kbd {
    font: 600 11px var(--mono); color: var(--fg); background: var(--panel);
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 2px 6px; white-space: nowrap; justify-self: end;
  }
  /* Bühne mit Touch-Steuerung links und rechts (nur bei Fingerbedienung sichtbar) */
  .play { display: grid; gap: 12px; justify-items: center; align-items: center; }
  .play > .stage { width: 100%; }
  .play > .stage.kreis { max-width: 720px; }
  .ctl { display: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; --b: 52px; }
  /* Joystick: Grundkreis mit beweglichem Knopf */
  .stick { position: relative; width: calc(var(--b) * 3.1); height: calc(var(--b) * 3.1); border-radius: 50%; pointer-events: auto; touch-action: none;
    background: radial-gradient(circle, rgba(255,255,255,0.06) 0 55%, rgba(255,255,255,0.12) 56% 58%, rgba(26,28,35,0.35) 59%); border: 1px solid rgba(255,255,255,0.18); }
  .stick .knob { position: absolute; left: 50%; top: 50%; width: calc(var(--b) * 1.25); height: calc(var(--b) * 1.25); margin: calc(var(--b) * -0.625) 0 0 calc(var(--b) * -0.625);
    border-radius: 50%; background: rgba(235,231,222,0.35); border: 1px solid rgba(255,255,255,0.45); box-shadow: 0 0 18px rgba(255,255,255,0.15); pointer-events: none; }
  .stick.on .knob { background: rgba(242,184,75,0.6); border-color: rgba(255,220,150,0.9); }
  .ctl button {
    font: 600 18px var(--mono); color: var(--fg); background: var(--panel); padding: 0;
    border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 8px; touch-action: none;
  }
  .ctl button.on { background: var(--line); }
  .acts { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; gap: 8px; align-items: center; }
  .acts [data-k="action"] { grid-area: 1 / 2 / 3 / 3; width: calc(var(--b) * 1.45); height: calc(var(--b) * 1.45); border-radius: 50%; background: var(--accent); color: #1a1408; border-color: #b9862c; }
  .acts .small { width: calc(var(--b) * 0.8); height: calc(var(--b) * 0.7); font-size: 14px; }
  .sgrid { display: none; grid-template-columns: repeat(3, calc(var(--b) * 0.9)); gap: 5px; }
  .sgrid button { height: calc(var(--b) * 0.75); font-size: 13px; line-height: 1; display: grid; place-items: center; }
  .sgrid small { font-size: 8px; color: var(--muted); font-weight: 400; }
  body.raum .sgrid { display: grid; }
  #btnInfo { display: none; }
  /* Touch-Geräte: Das Spielbild füllt den ganzen Bildschirm, alle Bedienelemente liegen halbdurchsichtig darüber.
     Die Texte (Regeln, Netz, Logbuch) öffnet der ⓘ-Knopf als Blatt. */
  @media (pointer: coarse) {
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    html, body, body * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .wrap { padding: 0; max-width: none; display: block; }
    .top { position: fixed; z-index: 5; top: max(8px, env(safe-area-inset-top, 0px)); left: max(8px, env(safe-area-inset-left, 0px)); display: block; }
    .top h1, .tag { display: none; }
    .tools { gap: 6px; }
    .tools button { width: 38px; height: 38px; padding: 0; font-size: 16px; display: grid; place-items: center; background: rgba(20, 21, 28, 0.55); border-color: rgba(255,255,255,0.16); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    .tools button span { display: none; }
    #btnKlang[aria-pressed="false"] b { opacity: 0.5; }
    #btnInfo { display: grid; }
    .play { position: fixed; inset: 0; display: block; }
    .play > .stage, .play > .stage.kreis { position: absolute; inset: 0; width: auto; height: auto; max-width: none; aspect-ratio: auto; border: 0; border-radius: 0; box-shadow: none; background: #000;
      display: flex; align-items: center; justify-content: center; }
    .play > .stage.kreis { background: radial-gradient(circle at center, #1a0f2e 0%, #05030b 70%); }
    .play > .stage #game { width: 100vw; height: 100dvh; aspect-ratio: auto; }
    .play > .stage #map { width: min(100vw, 100dvh); height: auto; aspect-ratio: 1 / 1; }
    .ctl { display: flex; position: fixed; z-index: 4; bottom: max(12px, env(safe-area-inset-bottom, 0px)); pointer-events: none; }
    .ctl button { pointer-events: auto; background: rgba(26, 28, 35, 0.42); border-color: rgba(255,255,255,0.18); color: rgba(255,255,255,0.9); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
    .ctl button.on { background: rgba(255,255,255,0.28); }
    .ctl .acts [data-k="action"] { background: rgba(242, 184, 75, 0.78); color: #1a1408; border-color: rgba(185,134,44,0.9); }
    .ctl-l { left: max(16px, env(safe-area-inset-left, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
    .ctl-r { right: max(12px, env(safe-area-inset-right, 0px)); flex-direction: column; align-items: flex-end; gap: 8px; }
    .side .sbtns { display: none !important; }
    /* Info-Blatt */
    .info { display: none; }
    body.infoOpen .info { display: flex; position: fixed; z-index: 6; overflow: auto; -webkit-overflow-scrolling: touch;
      top: calc(max(8px, env(safe-area-inset-top, 0px)) + 44px); bottom: max(12px, env(safe-area-inset-bottom, 0px));
      left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
      padding: 16px; border-radius: 12px; border: 1px solid var(--line); background: rgba(17, 18, 23, 0.95); align-content: start; }
    body.infoOpen #btnInfo { border-color: var(--accent); color: var(--accent); }
  }
  @media (pointer: coarse) and (orientation: landscape) {
    .tools { flex-direction: column; }
    body.infoOpen .info { top: max(8px, env(safe-area-inset-top, 0px)); left: calc(max(8px, env(safe-area-inset-left, 0px)) + 50px); }
  }
  @media (pointer: coarse) and (max-height: 560px) { .ctl { --b: 42px; } .acts [data-k="action"] { width: calc(var(--b) * 1.5); height: calc(var(--b) * 1.5); } }
  .sbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .sbtns button { font: 600 11px var(--mono); padding: 8px 10px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--fg); touch-action: none; }
  .sbtns button.on { background: var(--line); }
  .lv span.sys { color: var(--c); border-color: var(--c); }
  .snetz { margin-top: 14px; overflow-x: auto; }
  .snetz table { border-collapse: collapse; font-size: 11px; min-width: 100%; }
  .snetz th { text-align: left; font-weight: 600; color: var(--muted); padding: 3px 12px 3px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .snetz td { padding: 3px 12px 3px 0; color: var(--fg); vertical-align: top; }
  .snetz td.r { color: var(--c); white-space: nowrap; }
  .snetz caption { text-align: left; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #7dffb0; padding-bottom: 6px; }
  .slog { margin-top: 12px; display: grid; gap: 3px; font-size: 11px; line-height: 1.4; max-width: 62ch; }
  .slog p { margin: 0; color: var(--c, var(--muted)); }
</style>

<main class="wrap">
  <header class="top">
    <div>
      <h1>Tür<span>en</span></h1>
      <p class="tag" id="tag">Eine Von-Neumann-Sonde. Ihr Geist trainiert im Kreis der Spiele.</p>
    </div>
    <div class="tools">
      <button id="btnSonde" type="button" hidden><b>✦</b><span> Zur Sonde</span></button>
      <button id="btnKreis" type="button" hidden><b>◎</b><span> Zum Kreis</span></button>
      <button id="btnKlang" type="button" aria-pressed="false"><b>♪</b><span> Klang an</span></button>
      <button id="btnInfo" type="button" aria-label="Infos zeigen">ⓘ</button>
    </div>
  </header>

  <div class="play">
    <div class="ctl ctl-l" aria-hidden="true">
      <div class="stick" id="stick"><div class="knob"></div></div>
    </div>
    <div class="stage kreis" id="stage">
      <canvas id="map" width="1440" height="1440" aria-label="Kreis der Spiele"></canvas>
      <canvas id="game" width="1280" height="800" aria-label="Spielfläche" hidden></canvas>
    </div>
    <div class="ctl ctl-r" aria-hidden="true">
      <div class="sgrid">
        <button data-k="use">E<small>Dock</small></button><button data-k="build">B<small>Klon</small></button><button data-k="galaxy">G<small>Karte</small></button>
        <button data-k="netz">N<small>Netz</small></button><button data-k="weapon">Q<small>Waffe</small></button><button data-k="kreis">K<small>Kreis</small></button>
      </div>
      <div class="acts">
        <button data-k="menu" class="small">◁</button>
        <button data-k="reset" class="small">R</button>
        <button data-k="action">A</button>
      </div>
    </div>
  </div>

  <section class="info">
    <div>
      <span class="eyebrow" id="wnum"></span>
      <h2 id="wname"></h2>
      <p id="wrule"></p>
      <div class="lv" id="levels"></div>
      <div class="snetz" id="snetz" hidden></div>
      <div class="slog" id="slog" hidden></div>
    </div>
    <div class="side">
      <div class="sbtns" id="sondeBtns" hidden>
        <button type="button" data-k="use">E · Andocken</button><button type="button" data-k="build">B · Replizieren</button>
        <button type="button" data-k="galaxy">G · Sternenkarte</button><button type="button" data-k="kreis">K · Kreis</button>
        <button type="button" data-k="weapon">Q · Waffe</button><button type="button" data-k="netz">N · Netz</button>
      </div>
      <div class="keys" id="wkeys"></div>
      <div class="skills" id="skills" aria-label="Fähigkeiten"></div>
    </div>
  </section>

</main>

<script>
/* =====================================================================
   TÜREN – der Kreis der Spiele
   Jedes Spiel ist ein Objekt in WORLDS mit:
     name, rule, notes (pro Level), keys
     make(doorLight, level) -> { update(dt), draw(c), door(), done }   (level = 0 … LEVELS-1)
   In CATS steht, welche Spiele zu welcher Fähigkeit gehören. Die Karte (kern/kreis.js) ordnet
   sie als Speichen im Kreis an. Neues Spiel = Datei in welten/, <script>-Tag, Eintrag in WORLDS
   und sein Name in einer Kategorie von CATS.
   ===================================================================== */
const W = 640, H = 400;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
// Zwischenflächen für das Vollbild auf Touch-Geräten
const gcv = document.createElement('canvas'); gcv.width = 1280; gcv.height = 800; const gctx = gcv.getContext('2d');
const tcv = document.createElement('canvas'); tcv.width = 32; tcv.height = 20; const tctx = tcv.getContext('2d');
const view = { full: false, kr: 2, kg: 2, ox: 0, oy: 0, raum: { w: 640, h: 400, l: 0, r: 0, b: 0 } };

/* ---------- Eingabe ---------- */
const keys = {}, pressed = {};
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  Space: 'action', Enter: 'action', KeyR: 'reset', Escape: 'menu', KeyM: 'menu',
  KeyE: 'use', KeyB: 'build', KeyG: 'galaxy', KeyK: 'kreis', KeyQ: 'weapon', KeyN: 'netz'
};
function press(k) { if (!keys[k]) pressed[k] = true; keys[k] = true; }
function release(k) { keys[k] = false; }
// Langes Drücken soll kein Menü (Kopieren, Einsetzen, Lupe) öffnen
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('selectstart', e => e.preventDefault());
// Joystick für Touch: liefert stick.x/y (–1 … 1) für den Raumflug und drückt für alle Spiele die Pfeiltasten
const stick = { on: false, x: 0, y: 0 };
(() => {
  const el = document.getElementById('stick'), knob = el.firstElementChild, held = new Set();
  let id = null;
  function keysFor(x, y) {
    const want = new Set(), m = Math.hypot(x, y);
    if (m > 0.32) { // 8 Richtungen, die Schrägen sind schmaler als die geraden Richtungen
      const a = Math.atan2(y, x) * 180 / Math.PI, near = t => Math.abs(((a - t + 540) % 360) - 180);

/* ---------- Helfer ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const center = r => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });
function rng(seed) {
  return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
// Bewegt ein Rechteck achsenweise und schiebt es aus festen Rechtecken heraus.
function moveAndCollide(p, dx, dy, solids) {
  p.x += dx;
  for (const s of solids) if (overlap(p, s)) p.x = dx > 0 ? s.x - p.w : s.x + s.w;
  p.y += dy;
  for (const s of solids) if (overlap(p, s)) p.y = dy > 0 ? s.y - p.h : s.y + s.h;

// Wie weit die Tür offen steht: je näher die Spielfigur, desto weiter.

}
// Eine Tür, die in jeder Welt anders eingefärbt wird. Durch den Spalt leuchtet die nächste Welt.
function paintDoor(c, r, o) {
  c.save();

  c.fillStyle = o.frame; c.fillRect(r.x - 3, r.y - 3, r.w + 6, r.h + 3);
  c.shadowBlur = 0;
  c.fillStyle = o.light; c.fillRect(r.x, r.y, r.w, r.h);
  if (o.open > 0) { // Lichtkegel auf den Boden
    c.globalAlpha = 0.35 * o.open; c.fillStyle = o.light;
    c.beginPath(); c.moveTo(r.x, r.y + r.h); c.lineTo(r.x + r.w, r.y + r.h);
    c.lineTo(r.x + r.w + 14 * o.open, r.y + r.h + 18 * o.open); c.lineTo(r.x - 14 * o.open, r.y + r.h + 18 * o.open); c.fill();

function makeRepeater(first = 0.24, next = 0.11) {

  return dt => {
    const d = dirOf(pressed); if (d) { rep = first; return d; }
    rep -= dt; const h = dirOf(keys); if (h && rep <= 0) { rep = next; return h; }
    return null;

}
function label(c, text, x, y, color, align = 'left', size = 12) {

// Kreis gegen Rechteck: liefert Normale und Eindringtiefe oder null
function circleRect(cx, cy, r, b) {
  const px = clamp(cx, b.x, b.x + b.w), py = clamp(cy, b.y, b.y + b.h);
  let dx = cx - px, dy = cy - py, d = Math.hypot(dx, dy);

function lineOfSight(ax, ay, bx, by, solids, step = 6) {
  const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d / step);
  for (let i = 1; i < n; i++) {
    const x = ax + (bx - ax) * i / n, y = ay + (by - ay) * i / n;
    for (const s of solids) if (x > s.x && x < s.x + s.w && y > s.y && y < s.y + s.h) return false;
  }
  return true;
}

// Abschluss für Spiele ohne Laufweg: Nach dem Bestehen erscheint die Tür in der Mitte.
function makeFinale(light) {
  let t = -1; const rect = { x: W / 2 - 24, y: H / 2 - 56, w: 48, h: 90 };
  return {
    rect, get active() { return t >= 0; },
    start() { if (t < 0) t = 0; },
    update(dt) { t += dt; return t > 0.6 && (pressed.action || pressed.up); },
    draw(c, frame, panel) {
      if (t < 0) return;
      c.save(); c.globalAlpha = clamp(t / 0.6, 0, 1);
      c.fillStyle = 'rgba(0,0,0,0.5)'; c.fillRect(0, 0, W, H);
      paintDoor(c, rect, { frame, panel, knob: '#ffffff', light, glow: light, open: 0.4 + 0.2 * Math.sin(t * 3) });

// Jump'n'Run-Physik auf einem Kachelgitter (für "Sprung" und "Farbwechsel").
function platformPhysics(p, dt, T, solidAt, jumpPressed, jumpHeld) {
  const collide = (axis, d) => {
    const x0 = Math.floor(p.x / T), x1 = Math.floor((p.x + p.w - 0.01) / T);
    const y0 = Math.floor(p.y / T), y1 = Math.floor((p.y + p.h - 0.01) / T);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      if (!solidAt(x, y)) continue;
      if (axis === 'x') { p.x = d > 0 ? x * T - p.w : (x + 1) * T; p.vx = 0; }
      else { if (d > 0) { p.y = y * T - p.h; p.ground = true; } else p.y = (y + 1) * T; p.vy = 0; }
      return;
    }
  };
  const ax = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (ax) p.face = ax;
  p.vx += (ax * 170 - p.vx) * Math.min(1, dt * 14);
  if (jumpPressed) p.buffer = 0.12;
  p.coyote = p.ground ? 0.1 : p.coyote - dt; p.buffer -= dt;
  if (p.buffer > 0 && p.coyote > 0) { p.vy = -480; p.buffer = 0; p.coyote = 0; }
  if (!jumpHeld && p.vy < 0) p.vy += 1700 * dt; // kurzer Druck = kleiner Sprung
  p.vy = Math.min(p.vy + 1400 * dt, 700);
  const dx = p.vx * dt; p.x += dx; collide('x', dx);
  const dy = p.vy * dt; p.y += dy; p.ground = false; collide('y', dy);
  p.run += Math.abs(p.vx) * dt;
}

const GAMES = CATS.flatMap(cat => cat.games.map(name => {
  const w = WORLDS.find(x => x.name === name);
  return { ...w, id: w.make.name, cat: cat.id };
}));
const catOf = g => CATS.find(c => c.id === g.cat);

/* ---------- Fortschritt: pro Spiel die Zahl gemeisterter Level ---------- */
const LEVELS = 10;
const progress = {};
try { Object.assign(progress, JSON.parse(localStorage.getItem('tueren.kreis') || '{}')); } catch (e) {}
const saveProgress = () => { try { localStorage.setItem('tueren.kreis', JSON.stringify(progress)); } catch (e) {} };
const doneOf = gi => progress[GAMES[gi].id] || 0;

/* ---------- Ablauf: Kreis -> Intro -> Spielen -> durch die Tür -> zurück in den Kreis ---------- */
let gi = 0, li = 0, world = null, phase = 'map', pt = 0, doorR = null;
const stage = document.getElementById('stage'), mapCv = document.getElementById('map');
const btnKreis = document.getElementById('btnKreis'), btnKlang = document.getElementById('btnKlang'), btnSonde = document.getElementById('btnSonde');
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]));

function renderSkills() {
  $('skills').innerHTML = CATS.map(cat => {
    let d = 0, n = 0; GAMES.forEach((g, i) => { if (g.cat === cat.id) { d += doneOf(i); n += LEVELS; } });
    return `<b style="--c:${cat.color}">${cat.name}</b><i style="--c:${cat.color};--w:${Math.round(d / n * 100)}%"></i><em>${d}/${n} · ${SONDE_SYSTEME[cat.id]} ${Math.floor(d / 10)}</em>`;
  }).join('');
}
function renderInfo(g, l, inGame) {
  const gm = GAMES[g], cat = catOf(gm), done = doneOf(g);
  const info = document.querySelector('.info'); info.style.setProperty('--cat', cat.color);
  $('wnum').textContent = `${cat.name} · trainiert ${cat.ship} · Level ${l + 1} von ${LEVELS}`; $('wnum').style.color = cat.color;
  $('wname').textContent = gm.name;
  $('wrule').textContent = gm.rule + (gm.notes?.[l] ? ' ' + gm.notes[l] : '');
  $('levels').innerHTML = Array.from({ length: LEVELS }, (_, k) => k).map(k => `<span class="${k < done ? 'done' : k === done ? 'open' : ''}">Level ${k + 1} ${k < done ? '✓' : k === done ? '· offen' : '· gesperrt'}</span>`).join('');
  const keyList = inGame ? gm.keys.concat(gm.keys.some(([k]) => k === 'R') ? [] : [['R', 'Level neu starten']], [['Esc / M', 'zurück zum Kreis']])
    : [['← →', 'Spiel wählen'], ['↑ ↓', 'Level wählen (außen = schwerer)'], ['Leertaste', 'spielen'], ['Esc / Mitte', 'zurück zur Übersicht']];
  $('wkeys').innerHTML = keyList.map(([k, d]) => `<kbd>${esc(k)}</kbd><span>${esc(d)}</span>`).join('');
  renderSkills();
}
CATS.forEach(c => { c.ship = SONDE_SYSTEME[c.id]; });
const kreis = makeKreis(mapCv, {
  cats: CATS, games: GAMES, progress, levels: LEVELS,
  onSelect: (g, l) => renderInfo(g, l, false),
  onCategory: c => renderCategory(c),
  onPlay: (g, l) => startLevel(g, l)
});
// Info-Leiste in der Übersicht: Beschreibung der Kategorie und ihre Spiele
function renderCategory(c) {
  const cat = CATS[c], info = document.querySelector('.info'); info.style.setProperty('--cat', cat.color);
  let d = 0; GAMES.forEach((g, i) => { if (g.cat === cat.id) d += doneOf(i); });
  $('wnum').textContent = `Kategorie · ${d} von ${cat.games.length * LEVELS} Leveln`; $('wnum').style.color = cat.color;
  $('wname').textContent = cat.name;
  $('wrule').textContent = `${cat.about} Trainiert am Schiff: ${cat.ship}, Stufe ${Math.floor(d / 10)} – ${SONDE_SYSTEM_TEXT[cat.id]}. Alle 10 geschafften Level gibt es eine Stufe mehr.`;
  $('levels').innerHTML = GAMES.map((g, i) => g.cat === cat.id ? `<span class="${doneOf(i) === LEVELS ? 'done' : doneOf(i) ? 'open' : ''}">${esc(g.name)} ${doneOf(i)}/${LEVELS}</span>` : '').join('');
  $('wkeys').innerHTML = [['← →', 'Kategorie wählen'], ['Leertaste / ↑', 'Kategorie öffnen'], ['Maus / Touch', 'Sektor antippen']].map(([k, t]) => `<kbd>${esc(k)}</kbd><span>${esc(t)}</span>`).join('');
  renderSkills();
}

function showMap() {
  phase = 'map'; stage.classList.add('kreis'); mapCv.hidden = false; cv.hidden = true; btnKreis.hidden = true; btnSonde.hidden = false; sondeUi(false);
  $('tag').textContent = 'Der Kreis der Spiele trainiert die Sonde. Zehn Ringe: innen leicht, außen schwer.';
  Klang.setLevel(1);
  if (kreis.mode() === 'cat') { const s = kreis.sel(); renderInfo(s.g, s.l, false); } else renderCategory(kreis.cat());
  fitView();
}
function startLevel(g, l) {
  gi = g; li = l; world = GAMES[g].make(catOf(GAMES[g]).color, l);
  phase = 'intro'; pt = 0;
  stage.classList.remove('kreis'); mapCv.hidden = true; cv.hidden = false; btnKreis.hidden = false; btnKreis.lastChild.textContent = ' Zum Kreis'; btnSonde.hidden = true; sondeUi(false);
  Klang.setLevel(GAMES[g].name === 'Takt' ? 0 : 0.35);
  renderInfo(g, l, true); fitView();
}
btnKreis.addEventListener('click', () => { showMap(); btnKreis.blur(); });
btnSonde.addEventListener('click', () => { showRaum(); btnSonde.blur(); });
$('btnInfo').addEventListener('click', () => { document.body.classList.toggle('infoOpen'); $('btnInfo').blur(); });

/* ---------- Die Sonde im All ---------- */
const skillOf = id => GAMES.reduce((a, g, i) => a + (g.cat === id ? doneOf(i) : 0), 0);
const raum = makeRaum({ cats: CATS, skill: skillOf, onKreis: () => showMap(), stick: () => stick });
let raumUiT = 0;
function sondeUi(on) { document.body.classList.toggle('raum', on); $('sondeBtns').hidden = !on; $('slog').hidden = !on; $('snetz').hidden = !on; }
function showRaum() {
  phase = 'raum'; stage.classList.remove('kreis'); mapCv.hidden = true; cv.hidden = false;
  btnKreis.hidden = false; btnKreis.lastChild.textContent = ' Kreis der Spiele'; btnSonde.hidden = true; sondeUi(true);
  $('tag').textContent = 'Eine Von-Neumann-Sonde. Ihr Geist trainiert im Kreis der Spiele.';
  Klang.setLevel(0.75); raum.enter(); renderRaum(true); fitView();
}
function renderRaum(full) {
  const st = raum.status(), info = document.querySelector('.info'); info.style.setProperty('--cat', '#7dffb0');
  $('wnum').textContent = `Sonde · ${st.sys}`; $('wnum').style.color = '#7dffb0';
  $('wname').textContent = 'Von-Neumann-Sonde';
  const k = st.kosten, L = st.lager;
  $('wrule').textContent = `Netz: ${st.netz} von ${st.total} Systemen, ${st.klone} Klone. Netzlager: ${Math.floor(L.metall)} Metall, ${Math.floor(L.kristall)} Kristall, ${Math.floor(L.credits)} Credits. `
    + `Replizieren kostet ${k.metall} Metall, ${k.kristall} Kristall und ${k.fuel} Treibstoff. `
    + `Waffe: ${st.waffe.name} (${st.waffe.text}). Freigeschaltet: ${st.waffen.map(x => x.name).join(', ')}.`;
  $('slog').innerHTML = st.log.slice().reverse().map(e => `<p style="--c:${e.col}">${esc(e.text)}</p>`).join('');
  const RF = { bergbau: '#ffd23f', handel: '#2fd4a5', wache: '#ff6b9a', pionier: '#9b6bff' };
  const netzHtml = `<table><caption>Netz · alle Sonden</caption><tr><th>Nr</th><th>Name</th><th>System</th><th>Aufgabe</th><th>Leistung</th></tr>`
    + `<tr><td>1</td><td>Du</td><td>${esc(st.sys)}</td><td class="r" style="--c:#ffd86b">Original</td><td>Hülle ${Math.ceil(st.hull)} · Fracht ${st.used}/${st.fracht}</td></tr>`
    + st.nodes.map(n => `<tr><td>${n.nr}</td><td title="${esc(n.macke)}">${esc(n.name)}</td><td>${esc(n.sysName)} ${'●'.repeat(n.danger)}</td><td class="r" style="--c:${RF[n.rolle]}">${SONDE_ROLLEN[n.rolle].name}</td><td>${esc(n.leistung)}</td></tr>`).join('') + '</table>';
  if ($('snetz').dataset.html !== netzHtml) { $('snetz').innerHTML = netzHtml; $('snetz').dataset.html = netzHtml; }
  if (!full) return;
  const wv = raum.werte();
  $('levels').innerHTML = CATS.map(c => `<span class="sys" style="--c:${c.color}">${SONDE_SYSTEME[c.id]} · Stufe ${wv.stufe[c.id]}</span>`).join('');
  $('wkeys').innerHTML = [['← →', 'drehen'], ['↑ / ↓', 'Schub / bremsen'], ['Leertaste', 'schießen'], ['Q', 'Waffe wechseln'], ['E', 'andocken'], ['B', 'replizieren'], ['G', 'Sternenkarte'], ['N', 'Netz: alle Sonden'], ['K', 'Kreis der Spiele: Upgrades'], ['Esc', 'Fenster schließen']]
    .map(([a, b]) => `<kbd>${esc(a)}</kbd><span>${esc(b)}</span>`).join('');
  renderSkills();
}
btnKlang.addEventListener('click', () => { const on = Klang.toggle(); btnKlang.setAttribute('aria-pressed', on ? 'true' : 'false'); btnKlang.lastChild.textContent = on ? ' Klang aus' : ' Klang an'; btnKlang.blur(); });

function update(dt) {
  if (phase === 'raum') { raum.update(dt); raumUiT -= dt; if (raumUiT <= 0 && phase === 'raum') { raumUiT = 0.5; renderRaum(false); } }
  else if (phase === 'map') { if (pressed.kreis) showRaum(); else kreis.update(dt); }
  else if (pressed.menu) showMap();
  else if (phase === 'play') {
    stats.time += dt;
    if (pressed.reset) world = GAMES[gi].make(catOf(GAMES[gi]).color, li);
    world.update(dt);
    if (world.done) { phase = 'enter'; pt = 0; doorR = world.door(); }
  } else if (phase === 'intro') {
    pt += dt;
    if (pt > 2.2 || (pt > 0.5 && Object.keys(pressed).length)) phase = 'play';
  } else if (phase === 'enter') {
    pt += dt / 1.1;
    if (pt >= 1) {
      const id = GAMES[gi].id, first = (progress[id] || 0) <= li;
      progress[id] = Math.max(progress[id] || 0, li + 1); saveProgress();
      kreis.enterCat(CATS.findIndex(c => c.id === GAMES[gi].cat)); kreis.select(gi, Math.min(li + 1, LEVELS - 1)); showMap();
      if (first) kreis.ignite(gi, li);
    }
  }
  Klang.tick();
  for (const k in pressed) delete pressed[k];
}

function draw() {
  if (phase === 'map') return kreis.draw();
  if (phase === 'raum') {
    ctx.setTransform(view.kr, 0, 0, view.kr, 0, 0); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    return raum.draw(ctx, view.raum);
  }
  if (view.full) { drawGame(gctx); return present(); }
  drawGame(ctx);
}
function drawGame(ctx) {
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const col = catOf(GAMES[gi]).color;
  if (phase === 'enter') {
    const c = center(doorR), s = 1 + Math.pow(pt, 2.4) * 16;
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(s, s); ctx.translate(-c.x, -c.y);
    world.draw(ctx); ctx.restore();
    ctx.globalAlpha = clamp((pt - 0.35) / 0.5, 0, 1); ctx.fillStyle = col; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = clamp((pt - 0.8) / 0.2, 0, 1); ctx.fillStyle = '#05030b'; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    return;
  }
  world.draw(ctx);
  if (phase === 'intro') {
    const gm = GAMES[gi], fadeIn = clamp(1 - pt / 0.5, 0, 1), card = clamp(pt < 1.7 ? 1 : 1 - (pt - 1.7) / 0.5, 0, 1);
    ctx.fillStyle = `rgba(0,0,0,${Math.max(fadeIn, card * 0.6)})`; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = card; ctx.textAlign = 'center'; ctx.fillStyle = col;
    ctx.font = '600 13px "IBM Plex Mono", monospace'; ctx.fillText(`${catOf(gm).name.toUpperCase()}  ·  LEVEL ${li + 1} / ${LEVELS}`, W / 2, H / 2 - 34);
    ctx.fillStyle = '#fff'; ctx.font = '36px Bungee, "Arial Black", sans-serif'; ctx.fillText(gm.name.toUpperCase(), W / 2, H / 2 + 8);
    ctx.font = '13px "IBM Plex Mono", monospace'; ctx.fillStyle = 'rgba(255,255,255,0.8)';
    const text = li > 0 && gm.notes?.[li] ? gm.notes[li] : gm.rule;
    let line = '', y = H / 2 + 40; // Zeilenumbruch bei langen Texten
    for (const word of text.split(' ')) { if (ctx.measureText(line + word).width > 560 && line) { ctx.fillText(line.trim(), W / 2, y); line = ''; y += 18; } line += word + ' '; }
    ctx.fillText(line.trim(), W / 2, y);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
}

// Vollbild auf Touch-Geräten: Das Spiel (640 × 400) steht scharf im freien Bereich,
// den Rest füllt ein weichgezeichnetes, abgedunkeltes Abbild des Spiels.
function present() {
  const { kg, ox, oy } = view;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = true;
  tctx.drawImage(gcv, 0, 0, tcv.width, tcv.height);
  ctx.drawImage(tcv, 0, 0, cv.width, cv.height);
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(gcv, ox, oy, 640 * kg, 400 * kg);
}
// Größe der Zeichenfläche an den Bildschirm anpassen
function fitView() {
  view.full = matchMedia('(pointer: coarse)').matches;
  if (!view.full) {
    if (cv.width !== 1280 || cv.height !== 800) { cv.width = 1280; cv.height = 800; }
    Object.assign(view, { kr: 2, raum: { w: 640, h: 400, l: 0, r: 0, b: 0 } }); return;
  }
  const dpr = Math.min(devicePixelRatio || 1, 2), iw = innerWidth, ih = innerHeight;
  const cw = Math.round(iw * dpr), ch = Math.round(ih * dpr);
  if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
  const rl = document.querySelector('.ctl-l').getBoundingClientRect(), rr = document.querySelector('.ctl-r').getBoundingClientRect();
  const quer = iw >= ih;
  // Raumflug: Sichtfeld so breit (quer) bzw. so hoch (hoch) wie der Bildschirm
  const kr = quer ? ch / 400 : cw / 640; view.kr = kr;
  const toLog = px => px * dpr / kr;
  const rt = document.querySelector('.tools').getBoundingClientRect();
  view.raum = quer ? { w: cw / kr, h: 400, l: toLog(rl.right), r: toLog(iw - rr.left), b: 0, tl: toLog(rt.right + 4), tt: 0 }
                   : { w: 640, h: ch / kr, l: 0, r: 0, b: toLog(ih - Math.min(rl.top, rr.top)), tl: 0, tt: toLog(rt.bottom + 4) };
  // Spiele: im freien Bereich zentriert (hochkant über der Steuerung)
  const top = quer ? 0 : (document.querySelector('.top').getBoundingClientRect().bottom + 6) * dpr;
  const bottom = quer ? ch : Math.min(rl.top, rr.top) * dpr - 6 * dpr;
  const kg = Math.min(cw / 640, (bottom - top) / 400);
  Object.assign(view, { kg, ox: (cw - 640 * kg) / 2, oy: top + (bottom - top - 400 * kg) / 2 });
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}

addEventListener('resize', () => fitView());
function start(data) {
  fitView();
  // Beim ersten Besuch steht die Auswahl auf dem ersten Spiel, sonst auf dem zuletzt gewählten
  kreis.select(clamp(data?.gi ?? 0, 0, GAMES.length - 1), clamp(data?.li ?? 0, 0, LEVELS - 1));
  if (data?.cat) kreis.enterCat(CATS.findIndex(c => c.id === GAMES[data.gi].cat));
  if (data?.map) showMap(); else showRaum();
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => { raum.save(); return { gi: kreis.sel().g, li: kreis.sel().l, cat: kreis.mode() === 'cat', map: phase !== 'raum' }; });
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
<script>
  // Offline-Speicher: Beim ersten Start werden alle Dateien zwischengespeichert
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
</script>
